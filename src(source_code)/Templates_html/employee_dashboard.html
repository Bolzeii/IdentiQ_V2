<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IdentiQ | Employee Workspace</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #0c0d12;
            --panel: #161822;
            --border: #242838;
            --txt: #f8fafc;
            --sub: #828ba2;
            --accent: #3b82f6;
            --green: #10b981;
            --orange: #f59e0b;
            --hud-opacity: 0.03;
        }
        [data-theme="light"] {
            --bg: #f4f6fa;
            --panel: #ffffff;
            --border: #e2e8f0;
            --txt: #0f172a;
            --sub: #64748b;
            --accent: #2563eb;
            --green: #16a34a;
            --orange: #ea580c;
            --hud-opacity: 0.05;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        /* 🌌 Ambient HUD Grid Background Layer */
        body { 
            background: var(--bg); 
            color: var(--txt); 
            display: flex; 
            min-height: 100vh; 
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
        }
        body::before {
            content: "[ NODE_BUSY // NODE_03 ]";
            position: absolute; font-family: monospace; font-size: 10px; color: var(--txt);
            bottom: 20px; right: 20px; opacity: var(--hud-opacity); font-weight: 700;
        }

        aside { width: 260px; background: var(--panel); border-right: 1px solid var(--border); padding: 40px 24px; display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0; z-index: 10; }
        main { flex: 1; padding: 40px; overflow-y: auto; z-index: 5; position: relative; }
        
        .card { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
        .wrapper { max-width: 1240px; margin: 0 auto; display: grid; grid-template-columns: 1.4fr 1.6fr; gap: 35px; align-items: start; }
        .input-premium { width: 100%; padding: 12px 16px; background: rgba(0, 0, 0, 0.15); border: 1px solid var(--border); border-radius: 8px; color: var(--txt); outline: none; font-size: 14px; margin-bottom: 12px; display: block; }
        .input-premium:focus { border-color: var(--accent); }
        textarea.input-premium { height: 100px; resize: none; }
        
        .btn-premium { background: var(--txt); color: var(--bg); border: none; padding: 12px 24px; font-weight: 700; font-size: 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: opacity 0.2s; }
        .btn-premium:hover { opacity: 0.9; }
        
        /* ⚡ Interactive Laser-Glow Row Tracks */
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 14px 16px; color: var(--sub); font-size: 11px; text-transform: uppercase; font-weight: 800; border-bottom: 1px solid var(--border); }
        td { padding: 16px; border-bottom: 1px solid var(--border); font-size: 14px; transition: all 0.2s; }
        tr.log-row:hover td { 
            background: rgba(16, 185, 129, 0.03); 
            border-bottom-color: var(--green);
        }

        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px; color: var(--sub); text-decoration: none; font-weight: 700; border-radius: 8px; }
        .nav-link.active { color: var(--txt); background: rgba(255, 255, 255, 0.04); }
        .theme-switch-btn { position: fixed; top: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); color: var(--txt); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 1000; }
        .mini-ticket-card { background: rgba(0,0,0,0.12); padding: 14px; border-radius: 8px; margin-top: 12px; border-left: 3px solid var(--accent); font-size: 13px; }
    </style>
</head>
<body>
    <button class="theme-switch-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    
    <aside>
        <div>
            <h2 style="font-weight: 800; font-size: 22px; margin-bottom: 40px; letter-spacing: -1px;">IdentiQ <span style="font-weight:400; color:var(--accent);">Desk</span></h2>
            <nav>
                <a href="#" class="nav-link active"><i class="fa-solid fa-clipboard-user"></i> Attendance Check</a>
            </nav>
        </div>
        <button onclick="localStorage.clear(); window.location.href='/employee/login';" class="btn-premium" style="width:100%; justify-content:center; background: var(--border); color: var(--txt);">Sign Out</button>
    </aside>

    <main>
        <!-- Corner Decorative HUD Marks -->
        <span style="position: absolute; top: 10px; left: 10px; font-family: monospace; font-size: 10px; color: var(--txt); opacity: var(--hud-opacity);">+ MATRIX_SAFE_MODE_ENABLED</span>

        <header style="margin-bottom:35px;">
            <h1 style="font-weight: 800; font-size: 26px;">Employee Dashboard</h1>
            <p id="usrNode" style="color: var(--accent); font-size: 14px; font-weight: 600; margin-top:2px;"></p>
        </header>

        <div class="wrapper">
            <!-- Left Data Grid Container -->
            <div class="card" style="padding: 0; overflow: hidden; margin:0;">
                <div style="padding: 20px 24px; font-weight: 800; font-size: 16px; border-bottom: 1px solid var(--border);">Personal Logs Timeline</div>
                <table>
                    <thead>
                        <tr><th>Date</th><th>Clock-In</th><th>Clock-Out</th><th>Status</th></tr>
                    </thead>
                    <tbody id="pLogs"></tbody>
                </table>
            </div>

            <!-- Right Forms Segment -->
            <div style="display: flex; flex-direction: column; gap: 24px;">
                <div class="card" style="margin:0;">
                    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">Leave Dispensation</h3>
                    <p style="color: var(--sub); font-size: 12px; margin-bottom: 16px;">File a formal leave request directly to human resources.</p>
                    <input type="text" id="leaveSub" placeholder="Subject (e.g. Vacation Request)" class="input-premium">
                    <textarea id="leaveBody" placeholder="Specify execution target dates cleanly..." class="input-premium"></textarea>
                    <button class="btn-premium" onclick="submitForm('leave', 'leaveSub', 'leaveBody')">Dispatch Leave File</button>
                    <div id="myLeavesContainer"></div>
                </div>

                <div class="card" style="margin:0;">
                    <h3 style="font-size: 16px; font-weight: 800; margin-bottom: 4px;">Resolution Portal</h3>
                    <p style="color: var(--sub); font-size: 12px; margin-bottom: 16px;">File attendance corrections directly to administrators.</p>
                    <input type="text" id="resSub" placeholder="Subject (e.g. Erroneous Clock In)" class="input-premium">
                    <textarea id="resBody" placeholder="Provide problem context scenario details..." class="input-premium"></textarea>
                    <button class="btn-premium" onclick="submitForm('resolution', 'resSub', 'resBody')">Submit Resolution</button>
                    <div id="myResolutionsContainer"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const eid = localStorage.getItem('id_token');
        const ename = localStorage.getItem('id_name');
        if(!eid) window.location.href = '/employee/login';
        document.getElementById('usrNode').textContent = `Verification Node: ${ename} (${eid})`;

        const tBtn = document.getElementById('themeToggle');
        function applyTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', current);
            tBtn.innerHTML = current === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
        tBtn.addEventListener('click', () => {
            localStorage.setItem('theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            applyTheme();
        });
        applyTheme();

        async function submitForm(type, subId, bodyId) {
            const s = document.getElementById(subId).value.trim();
            const b = document.getElementById(bodyId).value.trim();
            if(!s || !b) return;
            const fd = new FormData();
            fd.append("ticket_type", type);
            fd.append("employee_name", ename);
            fd.append("subject", s);
            fd.append("issue", b);
            const res = await fetch('/api/employee/submit-ticket', { method: 'POST', body: fd });
            if(res.ok) { document.getElementById(subId).value=''; document.getElementById(bodyId).value=''; loadDataPipeline(); }
        }

        async function loadDataPipeline() {
            const logRes = await fetch(`/api/employee/records/${eid}`);
            if(logRes.ok) {
                const d = await logRes.json();
                document.getElementById('pLogs').innerHTML = d.logs.map(l => `
                    <tr class="log-row"><td>${l.date}</td><td>${l.clock_in}</td><td>${l.clock_out}</td><td><span style="color:var(--green); font-weight:800;">• ${l.status}</span></td></tr>
                `).join('');
            }

            const ticketRes = await fetch(`/api/employee/tickets/${ename}`);
            if(ticketRes.ok) {
                const data = await ticketRes.json();
                document.getElementById('myLeavesContainer').innerHTML = data.leaves.map(l => `
                    <div class="mini-ticket-card"><b>${l.subject}</b><br><span>${l.issue}</span><div style="margin-top:6px; color:var(--green); font-weight:700;">HR Response: ${l.reply}</div></div>
                `).join('');
                document.getElementById('myResolutionsContainer').innerHTML = data.resolutions.map(r => `
                    <div class="mini-ticket-card" style="border-left-color:var(--orange);"><b>${r.subject}</b><br><span>${r.issue}</span><div style="margin-top:4px; color:var(--green); font-weight:700;">Admin Response: ${r.reply}</div></div>
                `).join('');
            }
        }
        window.onload = loadDataPipeline;
    </script>
</body>
</html>
