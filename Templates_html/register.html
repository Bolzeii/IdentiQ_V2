<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IdentiQ | Register Profile</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root { --bg: #0c0d12; --panel: #161822; --border: #242838; --txt: #f8fafc; --sub: #828ba2; --accent: #3b82f6; --green: #10b981; --hud-opacity: 0.03; }
        [data-theme="light"] { --bg: #f4f6fa; --panel: #ffffff; --border: #e2e8f0; --txt: #0f172a; --sub: #64748b; --accent: #2563eb; --green: #16a34a; --hud-opacity: 0.05; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); color: var(--txt); 
            display: flex; 
            min-height: 100vh; 
            align-items: center; /* 🎯 Centers the card vertically */
            justify-content: center; /* 🎯 Centers the card horizontally */
            background-image: linear-gradient(var(--border) 1px, transparent 1px), linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px; position: relative;
            padding: 20px;
        }
        body::before { content: "[ PROFILES // REKOGNITION_MGMT ]"; position: absolute; font-family: monospace; font-size: 10px; color: var(--txt); bottom: 20px; right: 20px; opacity: var(--hud-opacity); font-weight: 700; }

        .glass-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 30px; width: 480px; box-shadow: 0 4px 20px rgba(0,0,0,0.2); z-index: 5; }
        .input-premium { width: 100%; padding: 12px 16px; background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 8px; color: var(--txt); outline: none; font-size: 14px; margin-bottom: 20px; display: block; }
        .input-premium:focus { border-color: var(--accent); }
        .btn-premium { background: var(--txt); color: var(--bg); border: none; padding: 14px; font-weight: 700; font-size: 14px; border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; transition: opacity 0.2s; }
        .theme-switch-btn { position: fixed; top: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); color: var(--txt); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 1000; }
    </style>
</head>
<body>
    <button class="theme-switch-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>

    <div class="glass-card">
        <h2 style="margin-bottom: 20px; font-weight: 800; font-size: 22px;">Add New Profile</h2>
        
        <!-- 🆔 Manual Employee ID Field -->
        <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom:8px; font-weight:600; color:var(--sub); font-size:13px;">Employee ID</label>
            <input type="text" id="empId" placeholder="e.g. EMP_101" class="input-premium" style="margin-bottom:0;">
        </div>

        <!-- 👤 Full Identity Name Field -->
        <div style="margin-bottom: 20px;">
            <label style="display:block; margin-bottom:8px; font-weight:600; color:var(--sub); font-size:13px;">Full Identity Name</label>
            <input type="text" id="empName" placeholder="Enter registration name..." class="input-premium" style="margin-bottom:0;">
        </div>

        <!-- 📹 Camera Snapshot Viewport -->
        <div style="width: 100%; height: 260px; border-radius: 12px; overflow: hidden; position: relative; border: 1px solid var(--border); margin-bottom: 20px; background: #000;">
            <video id="video" autoplay playsinline muted style="width:100%; height:100%; object-fit:cover;"></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>

        <button id="registerBtn" class="btn-premium">
            <i class="fa-solid fa-user-plus"></i> Index Profile Features
        </button>
        <p id="regStatus" style="text-align:center; margin-top:15px; font-weight:600; color:var(--sub); font-size:13px;">Align lens snapshot window and record string parameters</p>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const registerBtn = document.getElementById('registerBtn');
        const empIdInput = document.getElementById('empId');
        const empNameInput = document.getElementById('empName');
        const regStatus = document.getElementById('regStatus');

        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => { video.srcObject = stream; })
            .catch(err => { console.error(err); regStatus.textContent = "Camera initialization blocked"; });

        const tBtn = document.getElementById('themeToggle');
        function applyTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', current);
            tBtn.innerHTML = current === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
        tBtn.addEventListener('click', () => {
            localStorage.setItem('theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            applyTheme();
        });
        applyTheme();

        registerBtn.addEventListener('click', async () => {
            const empId = empIdInput.value.trim();
            const name = empNameInput.value.trim();
            
            if (!empId) { alert("Please input an Employee ID (e.g. EMP_101)."); return; }
            if (!name) { alert("Please input name credentials."); return; }

            registerBtn.disabled = true;
            regStatus.textContent = "Compiling features registry profile data...";

            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth; canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append("file", blob, "register.jpg");
                try {
                    // Send both employee_id and name as query parameters
                    const response = await fetch(`/api/register-employee?employee_id=${encodeURIComponent(empId)}&name=${encodeURIComponent(name)}`, { 
                        method: "POST", 
                        body: formData 
                    });
                    const result = await response.json();
                    
                    if (response.ok) { 
                        regStatus.textContent = `🎉 Registered Entry ID: ${result.employee_id || empId}`; 
                        empIdInput.value = "";
                        empNameInput.value = ""; 
                    } 
                    else { 
                        throw new Error(result.detail || "Registration rejected."); 
                    }
                } catch (error) { 
                    regStatus.textContent = `❌ Error: ${error.message}`; 
                } 
                finally { 
                    registerBtn.disabled = false; 
                }
            }, 'image/jpeg');
        });
    </script>
</body>
</html>
