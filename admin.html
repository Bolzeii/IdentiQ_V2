<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>IdentiQ | Profile Registration</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <style>
        :root {
            --bg: #0c0d12;
            --panel: #161822;
            --border: #242838;
            --txt: #f8fafc;
            --sub: #828ba2;
            --accent: #3b82f6;
            --green: #10b981;
            --hud-opacity: 0.03;
        }
        [data-theme="light"] {
            --bg: #f4f6fa;
            --panel: #ffffff;
            --border: #e2e8f0;
            --txt: #0f172a;
            --sub: #64748b;
            --accent: #2563eb;
            --green: #16a34a;
            --hud-opacity: 0.05;
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg); 
            color: var(--txt); 
            display: flex; 
            justify-content: center;
            align-items: center;
            min-height: 100vh; 
            background-image: 
                linear-gradient(var(--border) 1px, transparent 1px),
                linear-gradient(90deg, var(--border) 1px, transparent 1px);
            background-size: 40px 40px;
            position: relative;
            padding: 20px;
        }
        body::before {
            content: "[ 0x7F-REG_KIOSK ]";
            position: absolute; font-family: monospace; font-size: 10px; color: var(--txt);
            bottom: 20px; right: 20px; opacity: var(--hud-opacity); font-weight: 700;
        }

        .register-container {
            width: 100%;
            max-width: 500px;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
        }
        .register-container::after {
            content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 4px; background: var(--accent); border-radius: 0 0 16px 16px;
        }

        h1 { font-size: 28px; font-weight: 800; margin-bottom: 8px; letter-spacing: -0.5px; }
        .subtitle { color: var(--sub); font-size: 14px; margin-bottom: 30px; }

        .form-group { margin-bottom: 24px; }
        label { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; color: var(--sub); margin-bottom: 8px; letter-spacing: 0.5px; }
        
        .input-min { width: 100%; padding: 14px 16px; background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 8px; color: var(--txt); outline: none; font-size: 14px; transition: border-color 0.2s; }
        .input-min:focus { border-color: var(--accent); }
        [data-theme="light"] .input-min { background: rgba(0,0,0,0.02); }

        /* 📸 Camera Capture Window Styling */
        .camera-box { 
            width: 100%; 
            height: 280px; 
            background: #000; 
            border-radius: 12px; 
            margin-bottom: 24px; 
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .camera-box video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .camera-placeholder {
            position: absolute;
            color: var(--sub);
            font-size: 14px;
            text-align: center;
            pointer-events: none;
        }

        .btn-submit { width: 100%; background: var(--txt); color: var(--bg); border: none; padding: 14px; font-weight: 700; font-size: 15px; border-radius: 8px; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-submit:hover { opacity: 0.9; }
        
        .theme-switch-btn { position: fixed; top: 24px; right: 24px; background: var(--panel); border: 1px solid var(--border); color: var(--txt); width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; z-index: 1000; }
        
        .status-msg { margin-top: 15px; font-size: 13px; font-weight: 600; text-align: center; display: none; }
    </style>
</head>
<body>
    <button class="theme-switch-btn" id="themeToggle"><i class="fa-solid fa-moon"></i></button>
    
    <div class="register-container">
        <h1>Add New Profile</h1>
        <p class="subtitle">Index identity visual metrics into secure cloud records.</p>
        
        <div class="form-group">
            <label for="empName">Full Identity Name</label>
            <input type="text" id="empName" placeholder="Enter registration name..." class="input-min">
        </div>

        <label>Biometric Camera Matrix</label>
        <div class="camera-box">
            <video id="video" autoplay playsinline muted></video>
            <div class="camera-placeholder" id="placeholder"><i class="fa-solid fa-camera-retro" style="font-size: 24px; margin-bottom: 8px;"></i><br>Initializing Optical Lens...</div>
        </div>

        <button class="btn-submit" id="regBtn"><i class="fa-solid fa-user-plus"></i> Index Profile Features</button>
        <div class="status-msg" id="statusBox"></div>
    </div>

    <script>
        const tBtn = document.getElementById('themeToggle');
        const video = document.getElementById('video');
        const placeholder = document.getElementById('placeholder');
        const regBtn = document.getElementById('regBtn');
        const statusBox = document.getElementById('statusBox');

        // Dark/Light Mode Management Logic
        function applyTheme() {
            const current = localStorage.getItem('theme') || 'dark';
            document.documentElement.setAttribute('data-theme', current);
            tBtn.innerHTML = current === 'dark' ? '<i class="fa-solid fa-sun"></i>' : '<i class="fa-solid fa-moon"></i>';
        }
        tBtn.addEventListener('click', () => {
            localStorage.setItem('theme', document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
            applyTheme();
        });
        applyTheme();

        // Natively Boot Up Device Webcam Streaming
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
                video.srcObject = stream;
                placeholder.style.display = 'none';
            } catch (err) {
                console.error("Camera system access denied:", err);
                placeholder.innerHTML = '<i class="fa-solid fa-circle-exclamation" style="color:var(--red); font-size:24px;"></i><br>Camera initialization failed.';
            }
        }

        // Form Submission Payload Extraction & S3 Pipeline Upload Setup
        regBtn.addEventListener('click', async () => {
            const name = document.getElementById('empName').value.trim();
            if(!name) {
                showStatus("Please specify a valid profile name identifier.", "var(--orange)");
                return;
            }

            regBtn.disabled = true;
            showStatus("Capturing structure vector components...", "var(--accent)");

            // Freeze video matrix track framework frame to a memory blob canvas
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth || 640;
            canvas.height = video.videoHeight || 480;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            canvas.toBlob(async (blob) => {
                const formData = new FormData();
                formData.append('file', blob, 'registration.jpg');

                try {
                    const res = await fetch(`/api/register-employee?name=${encodeURIComponent(name)}`, {
                        method: 'POST',
                        body: formData
                    });
                    
                    const data = await res.json();
                    if(res.ok) {
                        showStatus(`Identity Locked successfully! ID: ${data.employee_id}`, "var(--green)");
                        document.getElementById('empName').value = '';
                    } else {
                        showStatus(`Pipeline Fault: ${data.detail || 'Failed processing registration metadata'}`, "var(--red)");
                    }
                } catch (err) {
                    showStatus("Network socket connection timeout failure.", "var(--red)");
                } finally {
                    regBtn.disabled = false;
                }
            }, 'image/jpeg', 0.9);
        });

        function showStatus(msg, color) {
            statusBox.textContent = msg;
            statusBox.style.color = color;
            statusBox.style.display = 'block';
        }

        window.onload = initCamera;
    </script>
</body>
</html>
